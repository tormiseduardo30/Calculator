<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hands on Project 1</title>
  <link rel="stylesheet" href="./calculator.css">
</head>
<body>

  <div class="container">

    <div class="input">0</div>
    <div
    class="buttons">

      <button class="clear-button" onclick="calculate('C')">C</button>
      <button class="operator" onclick="calculate('±')">±</button>
      <button class="operator" onclick="calculate('*')">x</button>
      <button class="delete-button" onclick="calculate('delete')">⌦</button>


      <button onclick="calculate('7')">7</button>
      <button onclick="calculate('8')">8</button>
      <button onclick="calculate('9')">9</button>
      <button class="operator" onclick="calculate('/')">/</button>


      <button onclick="calculate('4')">4</button>
      <button onclick="calculate('5')">5</button>
      <button onclick="calculate('6')">6</button>
      <button class="operator" onclick="calculate('-')">-</button>


      <button onclick="calculate('1')">1</button>
      <button onclick="calculate('2')">2</button>
      <button onclick="calculate('3')">3</button>
      <button class="operator" onclick="calculate('+')">+</button>


     <button class="operator" onclick="calculate('%')">%</button>
      <button onclick="calculate('0')">0</button>
      <button class="operator" onclick="calculate('.')">.</button>
      <button class="equal-button" onclick="calculate('=')">=</button>
    </div>

  </div>

  <script src="./calculator.js"></script>
  
</body>
</html>
